[project]
name = "pytket-docs-theming"
version = "1.0.0"
description = "Sphinx theming config for pytket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "enum-tools[sphinx]>=0.13.0",
    "furo>=2024.8.6",
    "myst-nb>=1.2.0",
    "sphinx>=9.0.0,<10.0.0",
    "sphinx-autodoc-typehints>=3.2.0",
    # Older sphinx-toolbox (via enum-tools) doesn't cap sphinx-autodoc-typehints but breaks on >=3.6.
    "sphinx-toolbox>=4.3.1",
    "sphinxcontrib-googleanalytics>=0.5",
    "sphinx-copybutton>=0.5.2",
    "quantinuum-sphinx>=1.0.0,<2.0.0"
]
